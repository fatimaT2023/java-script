<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Ordering System</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        .box {
            width: 350px;
            margin: auto;
            padding: 25px;
            border: 2px solid #ccc;
            border-radius: 10px;
        }

        input, select, button {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Restaurant</h1>

        <label>Customer Name</label>
        <input type="text" id="customerName" placeholder="Enter your name">

        <label>Choose your order</label>
        <select id="order">
            <option>Burger</option>
            <option>Shawarma</option>
            <option>Zinger</option>
        </select>

        <button id="submitBtn"
                onclick="showOrder()"
                onmouseover="changeColor()"
                onmouseout="returnColor()">
            Submit
        </button>

        <p id="result"></p>

    </div>

    <script src="day3t1.js"></script>

</body>
</html>
